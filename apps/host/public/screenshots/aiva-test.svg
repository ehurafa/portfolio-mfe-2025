<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Product card grid -->
  <g transform="translate(140, 160)">
    <!-- Product 1 -->
    <g transform="translate(0, 0)">
      <rect width="200" height="280" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2" opacity="0.9"/>
      <rect x="0" y="0" width="200" height="160" rx="10" fill="#10b981" opacity="0.35"/>
      <rect x="16" y="176" width="140" height="16" rx="3" fill="#334155"/>
      <rect x="16" y="200" width="90" height="16" rx="3" fill="#34d399" opacity="0.7"/>
      <rect x="16" y="234" width="168" height="30" rx="6" fill="#10b981" opacity="0.5"/>
    </g>
    <!-- Product 2 -->
    <g transform="translate(220, 0)">
      <rect width="200" height="280" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
      <rect x="0" y="0" width="200" height="160" rx="10" fill="#0ea5e9" opacity="0.35"/>
      <rect x="16" y="176" width="140" height="16" rx="3" fill="#334155"/>
      <rect x="16" y="200" width="90" height="16" rx="3" fill="#38bdf8" opacity="0.7"/>
      <rect x="16" y="234" width="168" height="30" rx="6" fill="#0ea5e9" opacity="0.5"/>
    </g>
    <!-- Product 3 -->
    <g transform="translate(440, 0)">
      <rect width="200" height="280" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
      <rect x="0" y="0" width="200" height="160" rx="10" fill="#f59e0b" opacity="0.35"/>
      <rect x="16" y="176" width="140" height="16" rx="3" fill="#334155"/>
      <rect x="16" y="200" width="90" height="16" rx="3" fill="#fbbf24" opacity="0.7"/>
      <rect x="16" y="234" width="168" height="30" rx="6" fill="#f59e0b" opacity="0.5"/>
    </g>
    <!-- Product 4 -->
    <g transform="translate(660, 0)">
      <rect width="200" height="280" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2" opacity="0.9"/>
      <rect x="0" y="0" width="200" height="160" rx="10" fill="#ec4899" opacity="0.35"/>
      <rect x="16" y="176" width="140" height="16" rx="3" fill="#334155"/>
      <rect x="16" y="200" width="90" height="16" rx="3" fill="#f472b6" opacity="0.7"/>
      <rect x="16" y="234" width="168" height="30" rx="6" fill="#ec4899" opacity="0.5"/>
    </g>
  </g>

  <!-- Title Text Overlay -->
  <text x="640" y="100" text-anchor="middle" font-family="Courier New, monospace" font-size="48" font-weight="bold" fill="#f0fdf4" filter="url(#glow)" letter-spacing="4">LOJA VIRTUAL</text>
  <text x="640" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" letter-spacing="2">REACT • ZUSTAND • VITE</text>

  <!-- Glowing Accents -->
  <circle cx="100" cy="100" r="200" fill="#10b981" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1180" cy="620" r="150" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>

</svg>
