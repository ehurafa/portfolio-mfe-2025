<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Card grid: blog posts -->
  <g transform="translate(140, 160)">
    <!-- Post card 1 -->
    <g transform="translate(0, 0)">
      <rect width="320" height="360" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2" opacity="0.9"/>
      <rect x="0" y="0" width="320" height="160" rx="10" fill="#e11d48" opacity="0.35"/>
      <rect x="20" y="180" width="120" height="20" rx="4" fill="#f87171" opacity="0.7"/>
      <rect x="20" y="215" width="280" height="16" rx="3" fill="#334155"/>
      <rect x="20" y="240" width="280" height="16" rx="3" fill="#334155"/>
      <rect x="20" y="265" width="180" height="16" rx="3" fill="#334155"/>
    </g>
    <!-- Post card 2 -->
    <g transform="translate(340, 0)">
      <rect width="320" height="360" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2" opacity="0.9"/>
      <rect x="0" y="0" width="320" height="160" rx="10" fill="#f59e0b" opacity="0.35"/>
      <rect x="20" y="180" width="120" height="20" rx="4" fill="#fbbf24" opacity="0.7"/>
      <rect x="20" y="215" width="280" height="16" rx="3" fill="#334155"/>
      <rect x="20" y="240" width="280" height="16" rx="3" fill="#334155"/>
      <rect x="20" y="265" width="180" height="16" rx="3" fill="#334155"/>
    </g>
    <!-- Post card 3 -->
    <g transform="translate(680, 0)">
      <rect width="320" height="360" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
      <rect x="0" y="0" width="320" height="160" rx="10" fill="#38bdf8" opacity="0.35"/>
      <rect x="20" y="180" width="120" height="20" rx="4" fill="#38bdf8" opacity="0.7"/>
      <rect x="20" y="215" width="280" height="16" rx="3" fill="#334155"/>
      <rect x="20" y="240" width="280" height="16" rx="3" fill="#334155"/>
      <rect x="20" y="265" width="180" height="16" rx="3" fill="#334155"/>
    </g>
  </g>

  <!-- Title Text Overlay -->
  <text x="640" y="100" text-anchor="middle" font-family="Courier New, monospace" font-size="48" font-weight="bold" fill="#f0f9ff" filter="url(#glow)" letter-spacing="4">BLOG ANGULAR</text>
  <text x="640" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#94a3b8" letter-spacing="2">ANGULAR 22 • SUPABASE • MATERIAL</text>

  <!-- Glowing Accents -->
  <circle cx="100" cy="100" r="200" fill="#38bdf8" opacity="0.05" filter="url(#glow)"/>
  <circle cx="1180" cy="620" r="150" fill="#a855f7" opacity="0.05" filter="url(#glow)"/>

</svg>
